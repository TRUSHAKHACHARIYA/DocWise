services:
  postgres:
    image: postgres:15-alpine
    container_name: docwise-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docwise
      POSTGRES_PASSWORD: docwise
      POSTGRES_DB: docwise
    volumes:
      - docwise_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docwise -d docwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docwise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docwise_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docwise_pg_data:
  docwise_redis_data:
