name: DocWise Quality Pipeline

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
      - name: Validate repo
        run: npm run validate
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/docwise_test"
          JWT_ACCESS_SECRET: "test-secret-at-least-32-chars-long-123"
          JWT_REFRESH_SECRET: "test-secret-at-least-32-chars-long-456"
          OPENAI_API_KEY: "test-openai-key"
          S3_ENDPOINT: "https://s3.local"
          S3_ACCESS_KEY_ID: "test-access-key"
          S3_SECRET_ACCESS_KEY: "test-secret-key"
          S3_BUCKET_NAME: "test-bucket"
          PINECONE_API_KEY: "test-pinecone-key"
          PINECONE_INDEX: "test-index"

  backend_build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      - name: Build backend
        run: |
          cd backend
          npm run build

  frontend_build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build

  security_scan:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Audit backend production dependencies
        run: npm audit --omit=dev --workspace backend
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --workspace frontend

  rag_eval_gate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate sample eval result for gate demonstration
        run: |
          mkdir -p backend/evals/results
          cp backend/evals/golden_qa.json backend/evals/results/latest_run.json
      - name: Enforce eval pass-rate gate
        run: npm run eval:gate
        env:
          EVAL_MIN_PASS_RATE: '0.00'

  deploy_backend:
    runs-on: ubuntu-latest
    needs: [backend_build, frontend_build, security_scan, rag_eval_gate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up --service docwise-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
