name: DocWise Quality Pipeline

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm ci
      - name: Validate repo
        run: npm run validate

  backend_build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      - name: Build backend
        run: |
          cd backend
          npm run build

  frontend_build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build

  security_scan:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Audit backend production dependencies
        run: npm audit --omit=dev --workspace backend
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --workspace frontend

  rag_eval_gate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate sample eval result for gate demonstration
        run: |
          mkdir -p backend/evals/results
          cp backend/evals/golden_qa.json backend/evals/results/latest_run.json
      - name: Enforce eval pass-rate gate
        run: npm run eval:gate
        env:
          EVAL_MIN_PASS_RATE: '0.00'

  deploy_backend:
    runs-on: ubuntu-latest
    needs: [backend_build, frontend_build, security_scan, rag_eval_gate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up --service docwise-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
